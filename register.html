<body data-auth-page="true">

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>
      <span><span class="brand-text-line1">Nestoria</span><br><span class="brand-text-line2">Live Elevated</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="listings.html">Listings</a>
      <a href="favorites.html">Favorites</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <div class="nav-actions" id="navAuthSlot" style="gap:10px;"></div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-panel" id="mobilePanel">
    <a href="index.html">Home</a>
    <a href="listings.html">Listings</a>

</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create Your Account</h2>
    <p>Join Nestoria to save favorites and message agents directly.</p>
    <div class="form-msg" id="registerMsg"></div>
    <form id="registerForm">
      <div class="field"><label>Full Name</label><input type="text" id="regName" required placeholder="Jane Doe"></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" required placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="regPassword" required placeholder="At least 6 characters"></div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
    </form>
    <div class="divider-row"><hr><span>OR</span><hr></div>
    <button type="button" class="btn btn-outline btn-block google-btn" id="googleRegisterBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4c-2 1.4-4.6 2.3-7.7 2.3-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C10 39.5 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.4 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span>Continue with Google</span>
    </button>
    <button type="button" class="btn btn-outline btn-block apple-btn" id="appleRegisterBtn" disabled title="Apple sign-in is coming soon">
      <svg width="17" height="17" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span>Continue with Apple</span>
      <span class="soon-badge">Soon</span>
    </button>
    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
